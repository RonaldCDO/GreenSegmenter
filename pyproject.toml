[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "greensegmenter"
version = "0.1.0"
description = "Aplicação local de anotação de vegetação com ExG e redes neurais"
requires-python = ">=3.11"
dependencies = [
    "gradio>=6.0,<7",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.10,<5",
    "Pillow>=10,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
neural = ["torch>=2.2,<3"]
gpu = ["cupy-cuda13x[ctk]>=14,<15"]

[tool.setuptools.packages.find]
include = ["greensegmenter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
